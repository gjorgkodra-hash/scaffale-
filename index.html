<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spinyl</title>
<meta name="description" content="Spinyl: la tua collezione di libri, vinili, CD, cassette e film">
<meta name="theme-color" content="#f4f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spinyl">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Rubik:ital,wght@0,400..800;1,700..800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" class="splash" translate="no" aria-hidden="true">
  <div class="splash-disc">
  <svg class="splash-logo" viewBox="30 30 140 140" aria-hidden="true">
    <path d="M100 30 A70 70 0 0 0 100 170 Z" fill="#0B0B0E"/>
    <path d="M100 42 A58 58 0 0 0 100 158" fill="none" stroke="#3A3842" stroke-width="2"/>
    <path d="M100 52 A48 48 0 0 0 100 148" fill="none" stroke="#3A3842" stroke-width="2"/>
    <path d="M100 62 A38 38 0 0 0 100 138" fill="none" stroke="#3A3842" stroke-width="2"/>
    <path d="M100 78 A22 22 0 0 0 100 122 Z" fill="#F59A2C"/>
    <path d="M100 30 A70 70 0 0 1 100 170 Z" fill="#F3EFE6"/>
    <g stroke="#BDB4A6" stroke-width="3" stroke-linecap="round">
      <line x1="110" y1="60" x2="147" y2="60"/><line x1="110" y1="72" x2="154" y2="72"/><line x1="110" y1="84" x2="158" y2="84"/><line x1="110" y1="96" x2="150" y2="96"/>
      <line x1="110" y1="108" x2="160" y2="108"/><line x1="110" y1="120" x2="157" y2="120"/><line x1="110" y1="132" x2="140" y2="132"/><line x1="110" y1="144" x2="144" y2="144"/>
    </g>
    <line x1="100" y1="30" x2="100" y2="170" stroke="#E8483A" stroke-width="4"/>
    <circle cx="100" cy="100" r="5" fill="#1C1B22"/>
  </svg>
  </div>
  <div class="splash-name">Spinyl</div>
</div>
<script>
  // Schermata di apertura: il logo gira per 3 secondi, poi sfuma. Un tocco la salta.
  (function () {
    var s = document.getElementById('splash'), done = false;
    function hide() { if (done) return; done = true; s.classList.add('out'); setTimeout(function () { s.remove(); }, 450); }
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(hide, reduce ? 1200 : 3000);
    s.addEventListener('click', hide);
  })();
</script>
<div id="app"></div>

<div id="sheetWrap" class="sheet-wrap hidden" aria-hidden="true">
  <div class="sheet-backdrop" data-a="closeSheet"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
</div>

<div id="scanner" class="scanner hidden" aria-hidden="true">
  <video id="scanVideo" playsinline muted autoplay></video>
  <div class="scan-frame"><span></span></div>
  <div class="scan-top">
    <button class="scan-close" data-a="closeScanner" aria-label="Chiudi">✕</button>
    <p class="scan-hint">Inquadra il codice a barre</p>
    <p class="scan-count" id="scanCount"></p>
  </div>
  <div class="scan-bottom-wrap">
  <button type="button" class="scan-done" data-a="closeScanner">Fine</button>
  <button type="button" class="scan-cover" data-a="scanCover">🖼️ Foto della copertina</button>
  <button type="button" class="scan-photo" data-a="scanPhoto">📷 Scatta una foto del codice</button>
  <form class="scan-bottom" id="manualCodeForm">
    <input id="manualCode" inputmode="numeric" placeholder="…oppure digita il codice" autocomplete="off">
    <button type="submit">Cerca</button>
  </form>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="scanPhotoInput" accept="image/*" capture="environment" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<input type="file" id="coverInput" accept="image/*" capture="environment" hidden>
<input type="file" id="csvInput" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel" hidden>
<div id="toast" class="toast" role="status"></div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="legal.js"></script>
<script src="app.js"></script>
</body>
</html>
